# Sources to monitor and keywords to watch for.
# Edit freely - add/remove feeds and watchlist terms without touching monitor.py.
#
# Feed URLs verified on 11 Nov 2026. AIN Capital and Vestbee are not listed:
# their feed endpoints return 403/301 to automated clients, so they would only
# add a permanent "failed to load" line to every digest.
#
# Do not add the same publication twice under two names (for example a main
# and a regional Sifted feed). They return the same articles, and monitor.py
# de-duplicates by link, so the second feed adds nothing but noise.

watchlist:
  - Poland
  - CEE
  - DACH
  - Germany
  - tender
  - procurement
  - market entry
  - expansion
  - go-to-market
  - Baltics
  - Czech
  - Romania
  - Hungary
  - Nordics
  - due diligence
  - compliance

feeds:
  - name: "Tech.eu"
    url: "https://tech.eu/feed/"
  - name: "EU-Startups"
    url: "https://www.eu-startups.com/feed/"
  - name: "TechCrunch Europe"
    url: "https://techcrunch.com/tag/europe/feed/"
  - name: "Sifted"
    url: "https://sifted.eu/feed/"
