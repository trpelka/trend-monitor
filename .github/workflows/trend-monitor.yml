name: Daily Trend Monitor

# Runs every day at 07:00 UTC.
# Can also be triggered manually from the Actions tab.
on:
  schedule:
    - cron: '0 7 * * *'
  workflow_dispatch: {}

permissions:
  contents: write
  issues: write

jobs:
  monitor:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Run trend monitor
        id: monitor
        run: python monitor.py

      - name: Commit digest to repo
        run: |
          git config user.name "trend-monitor-bot"
          git config user.email "actions@github.com"
          git add digests data
          git diff --staged --quiet || git commit -m "Trend digest: ${{ steps.monitor.outputs.digest_date }}"
          git push

      - name: Open a GitHub Issue with the digest
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh issue create \
            --title "Trend digest — ${{ steps.monitor.outputs.digest_date }} (${{ steps.monitor.outputs.trend_count }} cross-source repeats)" \
            --body-file "${{ steps.monitor.outputs.digest_path }}"
