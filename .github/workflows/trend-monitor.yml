name: Daily Trend Monitor

# Runs every day at 07:00 UTC.
# Can also be triggered manually from the Actions tab.
on:
  schedule:
    - cron: '0 7 * * *'
  workflow_dispatch: {}

permissions:
  contents: write
  issues: write

concurrency:
  group: trend-monitor
  cancel-in-progress: false

jobs:
  monitor:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
          cache: pip

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Run trend monitor
        id: monitor
        run: python monitor.py

      - name: Commit digest to repo
        run: |
          git config user.name "trend-monitor-bot"
          git config user.email "actions@github.com"
          git add digests data
          git diff --staged --quiet || git commit -m "Trend digest: ${{ steps.monitor.outputs.digest_date }}"
          git push

      # One issue, updated in place. Creating a new issue every day left the
      # repository with 68 open issues and looked abandoned.
      - name: Create or update the digest issue
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          DIGEST_DATE: ${{ steps.monitor.outputs.digest_date }}
          TREND_COUNT: ${{ steps.monitor.outputs.trend_count }}
          DIGEST_PATH: ${{ steps.monitor.outputs.digest_path }}
        run: |
          gh label create trend-digest --color 0e8a16 --description "Automated trend digest" --force
          number=$(gh issue list --label trend-digest --state open --limit 1 --json number --jq '.[0].number')
          title="Trend digest - ${DIGEST_DATE} (${TREND_COUNT} cross-source repeats)"
          if [ -n "$number" ]; then
            gh issue edit "$number" --title "$title" --body-file "$DIGEST_PATH"
          else
            gh issue create --title "$title" --body-file "$DIGEST_PATH" --label trend-digest
          fi
